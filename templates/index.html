<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Heart Disease Prediction</h1>
    <p>Enter patient details below</p>

    <form action="/predict" method="POST">

        <div class="grid">

            <div class="input-box">
                <label>Age</label>
                <input type="number" name="age" required>
            </div>

            <div class="input-box">
                <label>Gender</label>
                <select name="sex">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="input-box">
                <label>Chest Pain Type</label>
                <input type="number" name="cp" required>
            </div>

            <div class="input-box">
                <label>Resting Blood Pressure</label>
                <input type="number" name="trestbps" required>
            </div>

            <div class="input-box">
                <label>Cholesterol</label>
                <input type="number" name="chol" required>
            </div>

            <div class="input-box">
                <label>Fasting Blood Sugar</label>
                <select name="fbs">
                    <option value="1">True</option>
                    <option value="0">False</option>
                </select>
            </div>

            <div class="input-box">
                <label>Rest ECG</label>
                <input type="number" name="restecg" required>
            </div>

            <div class="input-box">
                <label>Maximum Heart Rate</label>
                <input type="number" name="thalach" required>
            </div>

            <div class="input-box">
                <label>Exercise Angina</label>
                <select name="exang">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="input-box">
                <label>Oldpeak</label>
                <input type="number" step="0.1" name="oldpeak" required>
            </div>

            <div class="input-box">
                <label>Slope</label>
                <input type="number" name="slope" required>
            </div>

            <div class="input-box">
                <label>CA</label>
                <input type="number" name="ca" required>
            </div>

            <div class="input-box">
                <label>Thal</label>
                <input type="number" name="thal" required>
            </div>

        </div>

        <button type="submit">Predict</button>

    </form>

    {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
    {% endif %}

</div>

</body>
</html>
